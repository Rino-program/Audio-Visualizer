name: Qodo Merge (PR-Agent)

on:
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: github.event.issue.pull_request && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run PR Agent on Comment
    steps:
      - name: PR Agent Action
        uses: qodo-ai/pr-agent@ad02d5b0c41b9b0652a50dc8e4d0c5ed00b18e57
        env:
          config.model: "gemini-3.5-flash"
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}